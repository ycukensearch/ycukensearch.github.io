<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wi-Fi Мессенджер | Йцукен</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
        .container { max-width: 800px; margin: 0 auto; width: 100%; height: 100%; display: flex; flex-direction: column; background: white; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        
        .header { padding: 15px; background: #075e54; color: white; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.2rem; }
        .status { font-size: 0.8rem; opacity: 0.9; }
        
        .chat-box { flex: 1; overflow-y: auto; padding: 15px; background: #e5ddd5; display: flex; flex-direction: column; gap: 8px; }
        .message { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 0.95rem; word-break: break-word; position: relative; }
        .message.own { align-self: flex-end; background: #dcf8c6; }
        .message.other { align-self: flex-start; background: white; }
        .sender { font-size: 0.7rem; color: #666; margin-bottom: 2px; display: block; font-weight: bold; }
        
        .input-area { padding: 10px; background: #f0f0f0; display: flex; gap: 10px; }
        .input-area input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        .input-area button { padding: 10px 20px; background: #075e54; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .input-area button:disabled { background: #999; }
        
        #join-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; padding: 20px; background: white; }
        #join-screen input { padding: 12px; width: 100%; max-width: 300px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 10px; font-size: 1rem; }
        #join-screen button { padding: 12px 30px; background: #075e54; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; width: 100%; max-width: 300px; }
        #join-screen .hint { margin-top: 15px; font-size: 0.8rem; color: #666; text-align: center; max-width: 300px; }
    </style>
</head>
<body>

<div class="container" id="app" style="display: none;">
    <div class="header">
        <h1>Wi-Fi Мессенджер</h1>
        <span class="status" id="status">Ожидание...</span>
    </div>
    <div class="chat-box" id="chat-box"></div>
    <div class="input-area">
        <input type="text" id="msg-input" placeholder="Введите сообщение..." disabled>
        <button id="send-btn" disabled>Отправить</button>
    </div>
</div>

<div class="container" id="join-screen">
    <h2 style="margin-bottom: 20px; color: #075e54;">Вход в чат</h2>
    <input type="text" id="username" placeholder="Ваше имя" value="User">
    <button id="join-btn">Войти</button>
    <p class="hint">Все устройства должны быть в одной сети Wi-Fi. После входа сообщите свой ID другим или введите ID друга, чтобы создать группу.</p>
    
    <div style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; width: 100%; max-width: 300px;">
        <input type="text" id="host-id-input" placeholder="ID хоста (если вы не первый)">
        <button id="connect-btn" style="background: #34a853;">Подключиться к хосту</button>
    </div>
</div>

<script>
    const joinScreen = document.getElementById('join-screen');
    const appScreen = document.getElementById('app');
    const chatBox = document.getElementById('chat-box');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const statusEl = document.getElementById('status');
    const usernameInput = document.getElementById('username');
    const hostIdInput = document.getElementById('host-id-input');

    let peer = null;
    let myId = null;
    let myName = 'User';
    let connections = []; // Массив активных соединений
    let isHost = false;

    // Инициализация Peer
    function initPeer() {
        // Используем публичный облачный сервер PeerJS только для сигналинга
        peer = new Peer();

        peer.on('open', (id) => {
            myId = id;
            console.log('Мой PeerJS ID:', id);
            
            // Показываем ID пользователю, чтобы он мог поделиться им
            statusEl.textContent = `Ваш ID: ${id.substring(0, 8)}...`;
            
            // Если мы не подключаемся к кому-то, значит мы становимся хостом
            if (!hostIdInput.value.trim()) {
                isHost = true;
                joinScreen.style.display = 'none';
                appScreen.style.display = 'flex';
                enableInput(true);
                addSystemMessage(`Вы вошли как ${myName} (Хост). Ваш ID для подключения: ${id}`);
            }
        });

        peer.on('connection', (conn) => {
            // Кто-то подключается к нам
            setupConnection(conn);
        });

        peer.on('error', (err) => {
            console.error('PeerJS Error:', err);
            alert('Ошибка соединения: ' + err.type + '. Проверьте сеть или обновите страницу.');
            enableInput(false);
        });
    }

    // Настройка соединения (входящего или исходящего)
    function setupConnection(conn) {
        conn.on('open', () => {
            // Добавляем соединение в список
            if (!connections.includes(conn)) {
                connections.push(conn);
            }
            
            // Если мы хост, сообщаем новому участнику, кто уже есть в чате
            // (Простая реализация: хост пересылает сообщения всем)
            
            updateStatus(`Подключено: ${connections.length} участников`);
        });

        conn.on('data', (data) => {
            handleIncomingData(data, conn);
        });

        conn.on('close', () => {
            connections = connections.filter(c => c !== conn);
            updateStatus(`Подключено: ${connections.length} участников`);
            addSystemMessage('Один из участников отключился.');
        });
    }

    // Обработка входящих данных
    function handleIncomingData(data, sourceConn) {
        if (data.type === 'chat') {
            addMessage(data.name, data.text, false);
            
            // Если мы хост, пересылаем сообщение остальным (кроме отправителя)
            if (isHost) {
                connections.forEach(conn => {
                    if (conn !== sourceConn && conn.open) {
                        conn.send(data);
                    }
                });
            }
        } else if (data.type === 'hello') {
            // Приветствие от нового участника (для хоста)
            // В реальном приложении здесь можно обновлять список пользователей
            addSystemMessage(`${data.name} присоединился к чату.`);
        }
    }

    // Отправка сообщения
    function sendMessage() {
        const text = msgInput.value.trim();
        if (!text) return;

        const data = {
            type: 'chat',
            name: myName,
            text: text,
            timestamp: Date.now()
        };

        // Добавляем сообщение себе в чат
        addMessage(myName, text, true);

        // Отправляем всем подключенным
        connections.forEach(conn => {
            if (conn.open) {
                conn.send(data);
            }
        });

        msgInput.value = '';
    }

    // Добавление сообщения в UI
    function addMessage(sender, text, isOwn) {
        const div = document.createElement('div');
        div.className = `message ${isOwn ? 'own' : 'other'}`;
        if (!isOwn) {
            const senderSpan = document.createElement('span');
            senderSpan.className = 'sender';
            senderSpan.textContent = sender;
            div.appendChild(senderSpan);
        }
        div.appendChild(document.createTextNode(text));
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function addSystemMessage(text) {
        const div = document.createElement('div');
        div.style.textAlign = 'center';
        div.style.color = '#888';
        div.style.fontSize = '0.8rem';
        div.style.margin = '5px 0';
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function updateStatus(text) {
        if (myId) {
            statusEl.textContent = text;
        }
    }

    function enableInput(enabled) {
        msgInput.disabled = !enabled;
        sendBtn.disabled = !enabled;
    }

    // Обработчики кнопок
    document.getElementById('join-btn').addEventListener('click', () => {
        myName = usernameInput.value.trim() || 'User';
        joinScreen.style.display = 'none';
        // Инициализация начнется после ввода ID хоста (или его отсутствия)
        initPeer();
    });

    document.getElementById('connect-btn').addEventListener('click', () => {
        const hostId = hostIdInput.value.trim();
        if (!hostId) {
            alert('Введите ID хоста');
            return;
        }
        
        myName = usernameInput.value.trim() || 'User';
        joinScreen.style.display = 'none';
        
        // Инициализируем пира
        peer = new Peer();
        
        peer.on('open', (id) => {
            myId = id;
            // Подключаемся к хосту
            const conn = peer.connect(hostId);
            
            conn.on('open', () => {
                connections.push(conn);
                appScreen.style.display = 'flex';
                enableInput(true);
                updateStatus('Подключено к хосту');
                addSystemMessage(`Вы подключились к хосту ${hostId.substring(0,8)}...`);
                
                // Отправляем приветствие
                conn.send({ type: 'hello', name: myName });
            });

            // Обработка входящих от хоста
            conn.on('data', (data) => {
                handleIncomingData(data, conn);
            });

            conn.on('close', () => {
                addSystemMessage('Соединение с хостом потеряно.');
                enableInput(false);
            });
            
            conn.on('error', (err) => {
                alert('Не удалось подключиться к хосту. Проверьте ID.');
                location.reload();
            });
        });
        
        peer.on('error', (err) => {
            console.error(err);
            alert('Ошибка: ' + err.type);
        });
    });

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>

</body>
                                                      </html>
